[project]
name = "vlog-editor-agent"
version = "0.1.0"
description = "Local-first agentic travel vlog editor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "faster-whisper>=1.2.1",
  "google-api-python-client>=2.198.0",
  "google-auth-httplib2>=0.4.1",
  "google-auth-oauthlib>=1.4.0",
  "pillow>=11.0",
  "pyyaml>=6.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.9",
]

[project.scripts]
ve = "vlog_editor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vlog_editor"]

[tool.hatch.build.targets.wheel.force-include]
"src/vlog_editor/assets" = "vlog_editor/assets"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.uv]
package = true
default-groups = ["dev"]
